version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: capacity_user
      POSTGRES_PASSWORD: strong_password
      POSTGRES_DB: capacity_connect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capacity_user -d capacity_connect"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://capacity_user:strong_password@postgres:5432/capacity_connect
      JWT_SECRET: change-this-to-a-very-strong-random-secret-at-least-32-chars
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8000,http://127.0.0.1:8001,http://localhost:8080
      STORAGE_PATH: ./storage
      LOG_LEVEL: info
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_storage:/app/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  local_ai_engine:
    build: ./secure_local_ai_engine
    environment:
      AI_ENGINE_HOST: 127.0.0.1
      AI_ENGINE_PORT: 8001
    ports:
      - "8001:8001"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    # Note: In production, local AI runs on 127.0.0.1 on device, not as separate service
    # This is for dev testing only

volumes:
  postgres_data:
  backend_storage:
