name: capacity_connect
description: Capacity Connect - Offline-first operational platform for MoES field personnel. SIH 2026 SIH26075.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  material_color_utilities: ^0.8.0

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Routing
  go_router: ^12.1.3

  # Local Storage
  drift: ^2.14.1
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.18
  sqlite3: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.8.3
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Network
  dio: ^5.4.1
  connectivity_plus: ^5.0.2
  pretty_dio_logger: ^1.3.1

  # Utils
  uuid: ^4.2.1
  intl: ^0.19.0
  logger: ^2.0.2+1
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  crypto: ^3.0.3
  encrypt: ^5.0.3

  # UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.2.3
  shimmer: ^3.0.0
  lottie: ^3.0.0

  # Media
  video_player: ^2.7.2
  chewie: ^1.7.4
  file_picker: ^8.0.6
  image_picker: ^1.0.7
  flutter_pdfview: ^1.3.2
  open_filex: ^4.4.0

  # 3D / Digital Twin
  model_viewer_plus: ^1.5.0
  flutter_3d_controller: ^1.3.1

  # Voice
  speech_to_text: ^6.5.1
  permission_handler: ^11.3.0

  # Search & Text
  flutter_typeahead: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  drift_dev: ^2.14.1
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1
  mocktail: ^1.0.3
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/docs/
    - assets/models/
    - assets/knowledge/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
